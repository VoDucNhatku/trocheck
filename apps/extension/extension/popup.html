<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>TrọCheck Collector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>TrọCheck Collector</h1>
    <p id="status" role="status">Đang đọc các bài đã lưu…</p>
    <p id="connection" role="status"></p>
    <button id="connect">Kết nối tài khoản TrọCheck</button>
    <button id="disconnect" hidden>Ngắt kết nối</button>
    <button id="dashboard">Mở bảng dữ liệu</button>
    <button id="download" disabled>Tải file JSON</button>
    <p class="note">Sau khi kết nối, bài từ nhóm và tìm kiếm bài viết Facebook bạn cuộn qua được che số điện thoại rồi tự động gửi về kho. Có thể tắt trong Cài đặt. File JSON chỉ gồm bài của tab này.</p>
    <script src="popup.js"></script>
  </body>
</html>
