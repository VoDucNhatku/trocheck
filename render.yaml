# Render Blueprint for the TrọCheck API (web app is on Vercel). Guide:
# docs/05-delivery/25-host-vercel-render.md. Values marked sync: false are entered in the
# Render dashboard and never committed.
services:
  - type: web
    name: trocheck-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Free plan: no persistent disk; data persists when DATABASE_URL points to PostgreSQL.
    # The instance still sleeps after about 15 idle minutes.
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        # Existing Blueprint updates ignore sync:false, preserving the dashboard value.
        # Manage this switch in the dashboard so a sync cannot re-enable demo data.
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false          # https://<project>.vercel.app
      - key: PASSWORD_RESET_BASE_URL
        sync: false          # same Vercel URL
      - key: GEMINI_API_KEY
        sync: false          # optional: without it the pipeline runs Regex only
      - key: GEMINI_MODEL_ID
        sync: false
      # Optional Google OAuth: all three values must be set before Google sign-in works.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://trocheck.vercel.app/api/auth/google/callback"

# Bot duyệt chạy song song (chỉ ghi chú; mặc định tắt trên môi trường triển khai):
# REVIEW_BOT_ENABLED=false
# REVIEW_BOT_MODEL_ID=  # Rỗng thì dùng GEMINI_MODEL_ID.
# REVIEW_BOT_DAILY_CALL_LIMIT=500  # 0 = không có hạn mức riêng, vẫn tính hạn mức chung.
