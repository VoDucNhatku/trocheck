# Render Blueprint for the TrọCheck API (web app is on Vercel). Guide:
# docs/05-delivery/25-host-vercel-render.md. Values marked sync: false are entered in the
# Render dashboard and never committed.
services:
  - type: web
    name: trocheck-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Free plan (chosen 2026-10-30): no persistent disk, so the SQLite DB is rebuilt and demo data
    # re-seeded on every start/deploy, and the instance sleeps after ~15 idle minutes.
    # To keep data: plan: starter and add
    #   disk: { name: trocheck-data, mountPath: /srv/data, sizeGB: 1 }
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false          # https://<project>.vercel.app
      - key: PASSWORD_RESET_BASE_URL
        sync: false          # same Vercel URL
      - key: GEMINI_API_KEY
        sync: false          # optional: without it the pipeline runs Regex only
      - key: GEMINI_MODEL_ID
        sync: false
      # Optional Google OAuth: all three values must be set before Google sign-in works.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://trocheck.vercel.app/api/auth/google/callback"
