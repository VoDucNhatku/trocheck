# Render Blueprint for the TrọCheck API (web app is on Vercel). Guide:
# docs/05-delivery/25-host-vercel-render.md. Values marked sync: false are entered in the
# Render dashboard and never committed.
services:
  - type: web
    name: trocheck-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter            # a persistent disk needs a paid instance; free instances lose the DB
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    disk:
      name: trocheck-data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false          # https://<project>.vercel.app
      - key: PASSWORD_RESET_BASE_URL
        sync: false          # same Vercel URL
      - key: GEMINI_API_KEY
        sync: false          # optional: without it the pipeline runs Regex only
      - key: GEMINI_MODEL_ID
        sync: false
